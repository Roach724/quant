[supervisord]
nodaemon=true
logfile=/var/log/quant/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=3

[program:ws_collector]
command=python /opt/quant/collectors/ws_collector.py
directory=/opt/quant
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/quant/collector/ws_collector.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
redirect_stderr=true
priority=10

[program:admin]
command=python /opt/quant/admin/server.py
directory=/opt/quant
autorestart=true
startretries=3
startsecs=3
stdout_logfile=/var/log/quant/admin/server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
redirect_stderr=true
priority=20

[program:admin_worker]
command=python /opt/quant/admin/worker.py
directory=/opt/quant
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/quant/admin/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
redirect_stderr=true
priority=30

[program:mlflow]
command=python -m mlflow ui --backend-store-uri sqlite:////var/data/mlflow.db --default-artifact-root /var/data/mlflow_artifacts --host 0.0.0.0 --port 5000
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/var/log/quant/mlflow.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
redirect_stderr=true
priority=40

[program:cron]
command=cron -f
autorestart=true
startretries=3
stdout_logfile=/var/log/quant/cron.log
redirect_stderr=true
priority=50
