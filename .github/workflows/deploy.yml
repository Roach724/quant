name: Deploy to Production

on:
  push:
    branches: [stable]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: deductive-notch-495015-c2
  REGION: asia-east2
  IMAGE: asia-east2-docker.pkg.dev/deductive-notch-495015-c2/quant/quant

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t ${{ env.IMAGE }}:$SHORT_SHA .
          docker tag ${{ env.IMAGE }}:$SHORT_SHA ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:$SHORT_SHA
          docker push ${{ env.IMAGE }}:latest
          echo "::notice::Pushed ${{ env.IMAGE }}:$SHORT_SHA"

      - name: Deploy to VM
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          set -e
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "Deploy attempt $i/$RETRIES..."
            if gcloud compute ssh quant-vm \
              --zone=${{ env.REGION }}-a \
              --command="
                cd /opt/quant-prod &&
                TAG=$SHORT_SHA docker compose pull &&
                docker compose up -d &&
                sleep 10 &&
                curl -f http://localhost:8091/api/health" 2>&1; then
              echo "::notice::Deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, waiting 30s..."
            sleep 30
          done
          echo "::error::All $RETRIES deploy attempts failed"
          exit 1
