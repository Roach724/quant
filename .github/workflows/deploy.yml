name: Deploy to Production

on:
  push:
    branches: [stable]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: deductive-notch-495015-c2
  REGION: asia-east2
  IMAGE: asia-east2-docker.pkg.dev/deductive-notch-495015-c2/quant/quant

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VM
        run: |
          set -e
          for i in $(seq 1 3); do
            echo "Deploy attempt $i/3..."
            if gcloud compute ssh quant-vm \
              --zone=${{ env.REGION }}-a \
              --command="
                set -e
                gcloud auth configure-docker asia-east2-docker.pkg.dev --quiet
                cd /opt/quant-prod &&
                sudo -u quant git stash && sudo -u quant git pull origin stable && sudo -u quant git stash pop || true

                # ── Graceful shutdown ──
                echo '=== Stopping experiments and ws_collector ==='
                docker exec quant python3 /opt/quant/scripts/pre_deploy_stop.py 2>/dev/null || true
                sleep 3

                echo '=== Deploying ==='
                TAG=${{ github.sha }} docker compose -f docker/docker-compose.yml pull &&
                docker compose -f docker/docker-compose.yml stop &&
                docker compose -f docker/docker-compose.yml rm -f &&
                TAG=${{ github.sha }} docker compose -f docker/docker-compose.yml up -d &&
                sleep 5 &&
                for j in 1 2 3 4 5 6; do
                  if curl -sf http://localhost:8091/api/health 2>/dev/null; then
                    echo '::notice::Health check passed'
                    break
                  fi
                  echo "Waiting... ($j/6)"
                  sleep 10
                done &&
              echo "::notice::Deploy succeeded on attempt $i"
              exit 0
            fi
            sleep 30
          done
          echo "::error::All deploy attempts failed"
          exit 1
