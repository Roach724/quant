# =============================================================================
# BollingerBands 布林带策略实验模板
# =============================================================================
# 策略逻辑:
#   - 布林带 = SMA(close, window) ± sigma × std(close, window)
#   - 买入: 价格触及/跌破下轨（超卖，均值回复预期）
#   - 卖出: 价格回升突破中轨（均值已回复）或超时退出
#   - John Bollinger 1980年代经典指标
#
# 适用市场: 震荡市 / 横盘市（趋势市中下轨可能持续被击穿）
# =============================================================================

live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: BollingerBands
  window: 20             # 布林带窗口（标准=20）
  sigma: 2.0             # 标准差倍数（标准=2.0，越大带宽越宽）
  top_k: 5               # 最大持仓数
  allocation: 0.0        # 每只分配比例，0=等权
  max_hold_bars: 60      # 最大持仓 bar 数，超时强制平仓

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/bollinger/
  checkpoint_interval: 300

experiment:
  name: "BollingerBands — 布林带均值回复"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
