# =============================================================================
# ATRTrailingStop 策略实验模板
# =============================================================================
# 策略逻辑:
#   - 入场: 价格突破 entry_ma 均线 → 买入
#   - 跟踪止损: 记录入场后最高价，止损线 = 最高价 - multiplier × ATR
#   - 离场: 收盘价跌破跟踪止损线 → 平仓
#   - ATR (Average True Range) 自动适应市场波动率
#
# 核心优势:
#   - 波动率自适应的止损，不会在波动大时过早离场
#   - 跟踪止损上移，让利润奔跑的同时保护已获利仓位
#   - 比固定百分比止损更智能
#
# 适用市场: 趋势市（止损随趋势上移，震荡市易被反复扫出）
# =============================================================================

live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: ATRTrailingStop
  atr_period: 20          # ATR 计算周期（标准=20）
  multiplier: 3.0         # 止损倍数（标准=3，越小止损越紧）
  entry_ma: 50            # 入场均线周期（价格突破此均线才入场）
  top_k: 5                # 最大持仓数
  allocation: 0.0         # 每只分配比例，0=等权

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/atr_stop/
  checkpoint_interval: 300

experiment:
  name: "ATRTrailingStop — 波动率自适应跟踪止损"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
