# =============================================================================
# MACrossover 双均线策略实验模板
# =============================================================================
# 策略逻辑:
#   - 快线 = SMA(close, fast)   → 短期均价
#   - 慢线 = SMA(close, slow)   → 长期均价
#   - 金叉: 快线上穿慢线 → 买入（短期趋势转多）
#   - 死叉: 快线下穿慢线 → 卖出（短期趋势转空）
#   - 买入优先级: 按快慢线差值（趋势强度）排名选 top_k
#
# 与 MACD 的区别:
#   - MACD 用 EMA + 信号线确认，三线系统
#   - MACrossover 用 SMA 直接比较，两线系统，更简洁
#   - MACrossover 假信号可能更多，但响应更快
#
# 适用市场: 强趋势市
# =============================================================================

live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: MACrossover
  fast: 10               # 快线周期（标准=10，越短越灵敏）
  slow: 30               # 慢线周期（标准=30，越长越稳定）
  top_k: 5               # 最大持仓数
  allocation: 0.0        # 每只分配比例，0=等权

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/macrossover/
  checkpoint_interval: 300

experiment:
  name: "MACrossover — 双均线金叉死叉"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
