# BollingerBands Live 多日实验配置模板
live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: BollingerBands
  window: 20                # 布林带窗口（标准=20）
  sigma: 2.0                # 标准差倍数（越大带宽越宽）
  top_k: 5
  allocation: 0.0
  max_hold_bars: 60         # 超时强制平仓

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper
    host: 127.0.0.1
    port: 11111
    max_position_pct: 0.2
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
    initial_capital: 100000

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2
  max_consecutive_failures: 10

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/bollinger/
  checkpoint_interval: 300

experiment:
  id: bollinger_v1
  name: "BollingerBands — 布林带均值回复"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
