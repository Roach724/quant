# RSI2 Live 多日实验配置模板（Larry Connors 超短线均值回复）
live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: RSI2
  rsi_period: 2             # RSI 周期（Connors 标准=2）
  buy_threshold: 10.0       # 超卖买入阈值（越低胜率越高）
  sell_threshold: 70.0      # 超买卖出阈值
  top_k: 5
  allocation: 0.0
  max_hold_bars: 3          # 超短线，最多持仓 3 根 bar

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper
    host: 127.0.0.1
    port: 11111
    max_position_pct: 0.2
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
    initial_capital: 100000

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2
  max_consecutive_failures: 10

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/rsi2/
  checkpoint_interval: 300

experiment:
  id: rsi2_v1
  name: "RSI2 — Larry Connors 超短线均值回复"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
