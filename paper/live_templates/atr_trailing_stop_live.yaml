# ATRTrailingStop Live 多日实验配置模板
live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: ATRTrailingStop
  atr_period: 20            # ATR 计算周期
  multiplier: 3.0           # 止损倍数（越小止损越紧）
  entry_ma: 50              # 入场均线周期
  top_k: 5
  allocation: 0.0

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper
    host: 127.0.0.1
    port: 11111
    max_position_pct: 0.2
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
    initial_capital: 100000

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2
  max_consecutive_failures: 10

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/atr_stop/
  checkpoint_interval: 300

experiment:
  id: atr_stop_v1
  name: "ATRTrailingStop — 波动率自适应止损"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
