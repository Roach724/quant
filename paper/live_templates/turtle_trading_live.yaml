# TurtleTrading Live 多日实验配置模板（Richard Dennis 海龟交易法）
live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: TurtleTrading
  entry_days: 20            # 入场 Donchian 周期（原版系统1=20）
  exit_days: 10             # 离场 Donchian 周期
  atr_period: 20            # ATR 周期（仓位计算用）
  risk_pct: 0.02            # 每笔风险 2% 权益
  top_k: 5
  allocation: 0.0           # 被 ATR 仓位覆盖

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper
    host: 127.0.0.1
    port: 11111
    max_position_pct: 0.2
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
    initial_capital: 100000

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2
  max_consecutive_failures: 10

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/turtle/
  checkpoint_interval: 300

experiment:
  id: turtle_v1
  name: "TurtleTrading — 海龟交易法"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
