# MultiFactorRank Live 多日实验配置模板
live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: MultiFactorRank
  top_k: 10                 # 最大持仓数
  rebalance_every: 13       # 调仓周期（13 ≈ 周度）
  lookback: 100             # OHLCV 历史窗口
  allocation: 0.0           # 0=等权
  factor_weights:           # 因子名 → 方向（+1=正向, -1=反向）
    ret_1d: 1
    ret_5d: 1
    ret_20d: 1
    vol_5d: -1
    vol_20d: -1
    turnover_5d: -1
    rsi_14: 1

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper
    host: 127.0.0.1
    port: 11111
    max_position_pct: 0.2
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
    initial_capital: 100000

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2
  max_consecutive_failures: 10

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/multifactor/
  checkpoint_interval: 300

experiment:
  id: multifactor_v1
  name: "MultiFactorRank — 多因子等权排名"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
