# =============================================================================
# TurtleTrading 海龟交易法实验模板
# =============================================================================
# 策略逻辑:
#   - Richard Dennis 1983年传奇趋势跟踪系统
#   - 入场: 价格突破 N 日最高价（Donchian 通道上沿）→ 买入
#   - 离场: 价格跌破 M 日最低价（Donchian 通道下沿）→ 平仓
#   - 仓位: ATR 波动率自适应（每笔风险 risk_pct% 权益）
#
# 原始海龟规则:
#   - 系统1: entry_days=20, exit_days=10（短线）
#   - 系统2: entry_days=55, exit_days=20（长线）
#   - 加仓: 每 0.5 ATR 加一次仓（本策略简化为单次入场）
#
# 适用市场: 强趋势市（震荡市中假突破频繁）
# =============================================================================

live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: TurtleTrading
  entry_days: 20         # 入场 Donchian 通道周期（原版系统1=20）
  exit_days: 10          # 离场 Donchian 通道周期（原版系统1=10）
  atr_period: 20         # ATR 计算周期（标准=20）
  risk_pct: 0.02         # 每笔交易风险比例（原版=2%）
  top_k: 5               # 最大持仓数
  allocation: 0.0        # 被 ATR 仓位覆盖，通常设 0

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/turtle/
  checkpoint_interval: 300

experiment:
  name: "TurtleTrading — 海龟交易法"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
