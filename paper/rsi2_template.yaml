# =============================================================================
# RSI2 策略实验模板
# =============================================================================
# 策略逻辑:
#   - Larry Connors 经典超短线均值回复策略（《Short Term Trading Strategies》）
#   - RSI(2) < buy_threshold（默认10）→ 极度超卖，买入博反弹
#   - RSI(2) > sell_threshold（默认70）→ 超买，止盈退出
#   - 最大持仓 3 根 bar（超短线，快进快出）
#
# 关键参数说明:
#   - rsi_period=2 是核心：周期越短越灵敏，2日RSI捕捉极端短期偏离
#   - buy_threshold=10 极低：只有在极端超卖才入场，提高胜率
#   - max_hold_bars=3：超短线策略，不宜长持
#
# 适用市场: 震荡市中表现最佳，趋势市中逆势单容易被套
# 历史表现: Connors 回测胜率 ~85%（美股）
# =============================================================================

live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: RSI2
  rsi_period: 2            # RSI 计算周期（Connors标准=2）
  buy_threshold: 10.0      # 超卖买入阈值（越低越严格，胜率越高）
  sell_threshold: 70.0     # 超买卖出阈值
  top_k: 5                 # 最大持仓数
  allocation: 0.0          # 每只分配比例，0=等权
  max_hold_bars: 3         # 最大持仓 bar 数（超短线=3）

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/rsi2/
  checkpoint_interval: 300

experiment:
  name: "RSI2 — Larry Connors超短线均值回复"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
