# =============================================================================
# MultiFactorRank 多因子排名策略实验模板
# =============================================================================
# 策略逻辑:
#   1. 对每只股票计算多个因子（动量、波动率、换手率、RSI等）
#   2. 横截面对每个因子做 z-score 标准化
#   3. 按方向加权求和 → 合成总分
#   4. 排名选 top_k，每次 rebalance 清旧仓→建新仓
#
# 因子方向说明:
#   +1 = 越高越好（动量、ROE、质量）
#   -1 = 越低越好（波动率、换手率，需反向）
#
# 默认因子池（7因子）:
#   ret_1d(+1)  ret_5d(+1)  ret_20d(+1)   — 短/中/长期动量
#   vol_5d(-1)  vol_20d(-1)               — 波动率（反向，低波好）
#   turnover_5d(-1)                        — 换手率（反向，低换手好）
#   rsi_14(+1)                             — RSI（正向）
#
# 因子注册表有 39 个因子可用，可在 factor_weights 中扩展。
# =============================================================================

live:
  market: us
  mode: live
  output_dir: output/live/

strategy:
  name: MultiFactorRank
  top_k: 10              # 最大持仓数
  rebalance_every: 13    # 调仓周期（13 ≈ 周度）
  lookback: 100          # OHLCV 历史窗口（bar数）
  allocation: 0.0        # 每只分配比例，0=等权(1/top_k)
  factor_weights:        # 因子名 → 方向（+1=正向, -1=反向）
    ret_1d: 1
    ret_5d: 1
    ret_20d: 1
    vol_5d: -1
    vol_20d: -1
    turnover_5d: -1
    rsi_14: 1

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0
  live:
    type: paper

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2

schedule:
  multi_day: true
  max_trading_days: 5
  bar_interval: 60
  pre_market_warmup: 300
  market_close_offset: 600
  max_duration_per_day: 390

state:
  enabled: true
  dir: /var/quant/state/multifactor/
  checkpoint_interval: 300

experiment:
  name: "MultiFactorRank — 多因子等权排名"

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: false
