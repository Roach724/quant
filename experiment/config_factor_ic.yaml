experiment:
  id: "f10_factor_ic"
  name: "F10 Factor IC Evaluation"
  description: "Evaluate Information Coefficient of 41 F10 fundamental factors"

data:
  f10_tables:
    - us_valuation
    - us_financials
    - us_analyst
    - us_capital_flow
    - us_shareholder
  forward_returns: us_bars_1d
  start: "2020-01-01"
  end: "2026-05-30"

evaluation:
  label: fwd_ret_5d
  method: spearman_rank
  criteria:
    min_abs_ic: 0.05
    min_t_stat: 3.0
    min_coverage: 0.70
    min_samples: 30
