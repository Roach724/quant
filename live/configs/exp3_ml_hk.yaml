# Exp3: MLPredStrategy (LightGBM hk_tech v1) — HK Multi-day Live Paper
live:
  mode: live
  market: hk
  output_dir: output/live/

broker:
  live:
    type: paper
    initial_capital: 1000000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0

strategy:
  name: MLPredStrategy
  market: hk
  model_type: lightgbm
  model_name: hk_tech
  model_version: 1
  train_start: "2020-01-01"
  train_end: "2025-12-31"
  top_k: 5
  rebalance_every: 13

schedule:
  bar_interval: 60
  multi_day: true
  max_trading_days: 4
  max_duration_per_day: 390

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  max_consecutive_failures: 10

observer:
  log_dir: output/live/
  snapshot_interval: 60

state:
  enabled: true
  dir: output/live/state_ml_hk/
  checkpoint_interval: 300

experiment:
  id: exp3_ml_hk
  name: "Exp3 — MLPredStrategy hk_tech v1 (HK, 4 days, $1M)"
