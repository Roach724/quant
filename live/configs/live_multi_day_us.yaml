# Multi-day live paper trading config
# Runs across multiple trading days with state persistence and holiday awareness.
#
# Usage:
#   python -m live.run --config live/configs/live_multi_day_us.yaml

live:
  mode: live
  market: us
  output_dir: output/live/

broker:
  live:
    type: paper
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0

strategy:
  name: SimpleMomentum
  top_k: 5
  lookback: 78
  rebalance_every: 13
  fallback_strategy: SimpleMomentum

schedule:
  bar_interval: 60
  multi_day: true
  max_trading_days: 5
  max_duration_per_day: 390

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  max_consecutive_failures: 10

observer:
  log_dir: output/live/
  snapshot_interval: 60

  port: 8090
  websocket: true

state:
  enabled: true
  dir: output/live/state/
  checkpoint_interval: 300

experiment:
  id: exp_multi_day_momentum
  name: "Multi-Day Live Paper — SimpleMomentum 5m"
