# Real-time paper trading — live BQ data + simulated execution
live:
  mode: live
  market: us
  output_dir: output/live/

broker:
  live:
    type: paper
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0

strategy:
  name: SimpleMomentum
  top_k: 5
  lookback: 78
  rebalance_every: 13
  fallback_strategy: SimpleMomentum

schedule:
  bar_interval: 60
  max_duration_minutes: 390       # stop after 6.5h (one full US session)

risk:
  max_drawdown: 0.15              # stop if equity drops 15% from peak
  max_daily_loss: 0.05            # stop if daily loss exceeds 5%
  max_consecutive_failures: 10    # stop after 10 consecutive BQ poll failures

observer:
  log_dir: output/live/
  snapshot_interval: 60

dashboard:
  port: 8090
  websocket: true

experiment:
  id: exp_live_paper_momentum
  name: "Live Paper — SimpleMomentum 5m"
