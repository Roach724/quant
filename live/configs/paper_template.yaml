live:
  mode: paper
  market: us
  output_dir: output/live/

broker:
  paper:
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0

strategy:
  name: MLPredStrategy
  model_name: momentum_lgbm
  model_version: latest
  top_k: 5
  rebalance_every: 5
  fallback_strategy: SimpleMomentum

schedule:
  bar_interval: 300

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

  port: 8090
  websocket: true

# Optional: experiment tracking via ExperimentTracker
experiment:
  id: "exp_ml_paper_us"
  name: "ML Momentum + Tech Factors — US Paper"
  hypothesis: "LightGBM on 39 tech factors outperforms SimpleMomentum on 240 US stocks"
  changes: ["Initial paper run with tech factor model v1"]
