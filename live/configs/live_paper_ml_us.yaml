# Real-time paper trading — live BQ data + ML model + simulated execution
live:
  mode: live
  market: us
  output_dir: output/live/

broker:
  live:
    type: paper                  # paper broker for simulation
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0

strategy:
  name: MLPredStrategy
  model_name: momentum_lgbm
  model_version: latest
  top_k: 5
  rebalance_every: 13            # once per hour on 5m bars
  fallback_strategy: SimpleMomentum

schedule:
  bar_interval: 60               # BQ poll interval (seconds)

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  position_size_pct: 0.2

observer:
  log_dir: output/live/
  snapshot_interval: 60
  trade_log: true
  equity_curve: true

dashboard:
  port: 8090
  websocket: true

experiment:
  id: exp_live_paper_ml
  name: "Live Paper — ML momentum_lgbm v1 5m"
  hypothesis: "LightGBM 39 tech factors on live 5m bars"
