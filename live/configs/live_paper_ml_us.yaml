live:
  mode: live
  market: us
  output_dir: output/live/

broker:
  live:
    type: paper
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0

strategy:
  name: MLPredStrategy
  model_name: momentum_lgbm
  model_version: latest
  top_k: 5
  rebalance_every: 13
  fallback_strategy: SimpleMomentum

schedule:
  bar_interval: 60
  max_duration_minutes: 390

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  max_consecutive_failures: 10

observer:
  log_dir: output/live/
  snapshot_interval: 60

dashboard:
  port: 8090
  websocket: true

experiment:
  id: exp_live_paper_ml
  name: "Live Paper — ML momentum_lgbm v1 5m"
