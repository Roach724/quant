  max_drawdown: 0.15
  max_daily_loss: 0.05
  max_consecutive_failures: 10

observer:
  log_dir: output/live/
  snapshot_interval: 60

  port: 8090
  websocket: true

experiment:
  id: exp_live_us
  name: "Live Trading — momentum_lgbm v1"
