live:
  mode: live
  market: us
  output_dir: output/live/

broker:
  live:
    type: futu_stock
    host: 127.0.0.1
    port: 11111
    max_position_pct: 0.2

strategy:
  name: MLPredStrategy
  model_name: momentum_lgbm
  model_version: latest
  top_k: 5
  rebalance_every: 13
  fallback_strategy: SimpleMomentum

