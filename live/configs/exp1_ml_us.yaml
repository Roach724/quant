# Exp1: MLPredStrategy (LightGBM us_tech v2) — Multi-day Live Paper
live:
  mode: live
  market: us
  output_dir: output/live/

broker:
  live:
    type: paper
    initial_capital: 100000
    slippage_bps: 5
    commission_bps: 1
    min_commission: 1.0

strategy:
  name: MLPredStrategy
  market: us
  model_type: lightgbm
  model_name: us_tech
  model_version: 2
  train_start: "2020-01-01"
  train_end: "2025-12-31"
  top_k: 5
  rebalance_every: 13

schedule:
  bar_interval: 60
  multi_day: true
  max_trading_days: 5
  max_duration_per_day: 390

risk:
  max_drawdown: 0.15
  max_daily_loss: 0.05
  max_consecutive_failures: 10

observer:
  log_dir: output/live/
  snapshot_interval: 60

state:
  enabled: true
  dir: /var/quant/state/ml/
  checkpoint_interval: 300

experiment:
  type: live
  market: us
  strategy: ml
  version: 2
  name: "MLPredStrategy us_tech v2"
